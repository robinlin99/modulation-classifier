[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modulation-classifier"
version = "0.1.0"
authors = [
    {name = "Robin Lin", email = "zl755@cornell.edu"},
]
description = "Deep learning framework for radio modulation classification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["deep-learning", "radio", "modulation", "classification", "pytorch"]

dependencies = [
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "h5py>=3.7.0",
    "tqdm>=4.64.0",
    "seaborn>=0.11.0",
    "tensorboard>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pre-commit>=2.17.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-argparse>=0.4",
]

[project.urls]
Homepage = "https://github.com/robinzl/modulation-classifier"
Repository = "https://github.com/robinzl/modulation-classifier"
Documentation = "https://github.com/robinzl/modulation-classifier/tree/main/docs"
"Bug Tracker" = "https://github.com/robinzl/modulation-classifier/issues"

[project.scripts]
modulation-train = "modulation_classifier.cli:train_cli"
modulation-predict = "modulation_classifier.cli:predict_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=modulation_classifier --cov-report=html --cov-report=term-missing"